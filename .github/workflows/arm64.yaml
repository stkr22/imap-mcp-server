name: Build arm64 image

# Fork addition. Upstream publishes no image and the cluster is arm64, so this
# builds the Dockerfile natively on an arm runner (no emulation).
on:
  push:
    branches: [main]
    paths:
      - src/**
      - Dockerfile
      - requirements.lock
      - .github/workflows/arm64.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/stkr22/imap-mcp-server

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version string is set by upstream and never bumps with fork changes,
      # so the tag carries a fork revision too.
      - id: version
        run: echo "v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/imap_mcp/__init__.py)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.v }}-stkr22.${{ github.run_number }}
            type=sha

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/stkr22/imap-mcp-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
